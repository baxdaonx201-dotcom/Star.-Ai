

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d1c;color:white;
 font-family:Arial,sans-serif;
 display:flex;flex-direction:column;height:100vh
}
header{
 padding:20px;text-align:center;
 background:#111a32;border-bottom:1px solid #26385e
}
header h1{margin:0;color:#55c8ff}
header p{margin:7px;color:#a9bad5}
#chat{
 flex:1;overflow-y:auto;padding:18px;
 display:flex;flex-direction:column;gap:14px
}
.msg{
 max-width:85%;padding:13px 16px;
 border-radius:15px;line-height:1.5;
 white-space:pre-wrap
}
.user{align-self:flex-end;background:#176bd1}
.bot{align-self:flex-start;background:#17243d}
form{
 display:flex;gap:9px;padding:14px;
 background:#111a32
}
input{
 flex:1;min-width:0;padding:14px;
 border:1px solid #34496c;border-radius:12px;
 background:#080d1c;color:white;font-size:16px
}
button{
 border:0;border-radius:12px;
 background:#168cff;color:white;
 padding:0 20px;font-weight:bold
}
</style>
</head>
<body>
<header>
<h1>⭐ STAR AI</h1>
<p>Asisten AI pribadi kamu</p>
</header>
<div id="chat">
<div class="msg bot">Halo! 👋 Aku STAR AI. Ada yang bisa aku bantu?</div>
</div>
<form id="form">
<input id="input" placeholder="Tulis pesan..." autocomplete="off">
<button type="submit">Kirim</button>
</form>
<script>
const form=document.getElementById("form");
const input=document.getElementById("input");
const chat=document.getElementById("chat");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",function(e){
 e.preventDefault();
 const message=input.value.trim();
 if(!message)return;
 addMessage(message,"user");
 input.value="";
 addMessage(
 "Pesan kamu sudah diterima! ⭐\n\nAku masih dalam mode demo. Untuk menjawab pertanyaan sungguhan, STAR AI perlu dihubungkan ke API AI.",
 "bot"
 );
});
</script>
</body>
</html>
